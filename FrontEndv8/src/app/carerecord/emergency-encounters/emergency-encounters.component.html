<div class="emergency-view" [class.emergency-mode]="viewMode === 'emergency'">
  <div *ngIf="viewMode === 'emergency'" class="emergency-banner"><i class="fas fa-user-doctor"></i> RECENT ENCOUNTERS - EMERGENCY VIEW</div>
  <h2 style="margin-bottom:15px;"><i class="fas fa-user-doctor" style="color:#c0392b;"></i> Recent Encounters<small style="font-weight:normal;color:#666;">Most recent clinical encounters for context</small></h2>
  <mat-card *ngIf="precisComponentReference">
    <mat-card-content>
      <table mat-table [dataSource]="recentEncounters" class="full-width-table" *ngIf="recentEncounters.length > 0; else noEncounters">
        <ng-container matColumnDef="type"><th mat-header-cell *matHeaderCellDef>Type</th><td mat-cell *matCellDef="let e">{{e.type}}</td></ng-container>
        <ng-container matColumnDef="location"><th mat-header-cell *matHeaderCellDef>Location</th><td mat-cell *matCellDef="let e">{{e.location}}</td></ng-container>
        <ng-container matColumnDef="practitioner"><th mat-header-cell *matHeaderCellDef>Practitioner</th><td mat-cell *matCellDef="let e">{{e.practitioner}}</td></ng-container>
        <ng-container matColumnDef="date"><th mat-header-cell *matHeaderCellDef>Date</th><td mat-cell *matCellDef="let e">{{e.date}}</td></ng-container>
        <tr mat-header-row *matHeaderRowDef="['type','location','practitioner','date']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['type','location','practitioner','date'];"></tr>
      </table>
      <ng-template #noEncounters><p style="text-align:center;padding:20px;color:#999;">No recent encounters recorded.</p></ng-template>
    </mat-card-content>
  </mat-card>
  <mat-card *ngIf="!precisComponentReference"><mat-card-content><p style="text-align:center;padding:40px;">Please select a patient to view recent encounters.</p></mat-card-content></mat-card>
</div>
