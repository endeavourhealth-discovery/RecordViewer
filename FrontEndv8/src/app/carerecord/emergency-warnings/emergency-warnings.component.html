<div class="emergency-view" [class.emergency-mode]="viewMode === 'emergency'">
  <div *ngIf="viewMode === 'emergency'" class="emergency-banner"><i class="fas fa-exclamation-triangle"></i> WARNINGS & FLAGS - EMERGENCY VIEW</div>
  <h2 style="margin-bottom:15px;"><i class="fas fa-exclamation-triangle" style="color:#c0392b;"></i> Warnings & Flags<small style="font-weight:normal;color:#666;">Active clinical warnings and safety flags</small></h2>
  <mat-card *ngIf="precisComponentReference">
    <mat-card-content>
      <table mat-table [dataSource]="activeWarnings" class="full-width-table" *ngIf="activeWarnings.length > 0; else noWarnings">
        <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Warning/Flag</th><td mat-cell *matCellDef="let e" style="font-weight:600;color:#c0392b;">{{e.name}}</td></ng-container>
        <ng-container matColumnDef="code"><th mat-header-cell *matHeaderCellDef>Code</th><td mat-cell *matCellDef="let e" style="font-size:0.8em;color:#666;">{{e.code}}</td></ng-container>
        <ng-container matColumnDef="date"><th mat-header-cell *matHeaderCellDef>Date</th><td mat-cell *matCellDef="let e">{{e.date}}</td></ng-container>
        <tr mat-header-row *matHeaderRowDef="['name','code','date']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['name','code','date'];"></tr>
      </table>
      <ng-template #noWarnings><p style="text-align:center;padding:20px;color:#999;">No active warnings or flags recorded.</p></ng-template>
    </mat-card-content>
  </mat-card>
  <mat-card *ngIf="!precisComponentReference"><mat-card-content><p style="text-align:center;padding:40px;">Please select a patient to view warnings and flags.</p></mat-card-content></mat-card>
</div>
