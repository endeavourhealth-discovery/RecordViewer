version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto8
  pre_build:
    commands:
      - IP=$(curl http://checkip.amazonaws.com)/32
      - echo $IP of CodeBuild Instance
      - aws s3 cp s3://endeavour-codebuild/settings/settings.xml /root/.m2/settings.xml
  build:
    commands:
      - echo Build started on `date`
      - chmod +x aws_scripts/build.sh
      - aws_scripts/build.sh mvn -B package
  post_build:
    commands:
      - IP=$(curl http://checkip.amazonaws.com)/32
      - echo $IP of CodeBuild Instance
      - echo Packaging application
      - cd VUE/record-viewer
      - zip -r frontend.zip appspec.yml cleanup dist/
      - mv frontend.zip frontend
      - echo Packaging core
      - cd ../../API
      - zip -r api.zip appspec.yml cleanup permissions target/api
      - mv api.zip api
      - echo Build completed on `date`
artifacts:
  files:
    - VUE/record-viewer/frontend
    - API/api
  discard-paths: yes
